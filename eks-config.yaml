apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: devsecops-demo
  region: ap-south-1
  version: "1.35"
  tags:
    owner: fvishw
    environment: dev
    project:  devsecops-demo
    purpose: learning

availabilityZones:
  - ap-south-1a
  - ap-south-1b

iam:
  withOIDC: true

managedNodeGroups:
  - name: devsecops-ng-public
    instanceType: t3.small
    minSize: 2
    maxSize: 2
    desiredCapacity: 2
    volumeSize: 20
    privateNetworking: false

    ssh:
      allow: true
      publicKeyName: archy-mumbai   # your EC2 key pair name

    iam:
      withAddonPolicies:
        autoScaler: true
        ebs: true
        albIngress: true
        externalDNS: true
        certManager: false
        cloudWatch: false
    labels:
      owner: fvishw
      app: devsecops-demo
    tags:
      node-type: public-worker
      managed-by: eksctl
